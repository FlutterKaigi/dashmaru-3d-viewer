name: CI / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    name: 品質確認・Web ビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: mise.toml の Flutter をインストール
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          persist_github_token: false

      - name: 依存関係をインストール
        run: flutter pub get --enforce-lockfile

      - name: Dart のフォーマットを確認
        run: dart format --output=none --set-exit-if-changed lib test hook tool

      - name: 静的解析
        run: flutter analyze

      - name: テスト
        run: flutter test

      - name: モデル比較ツールをテスト
        run: python3 -m unittest discover -s tool -p 'test_*.py'

      - name: モデルと生成スクリプトの同期を確認
        run: python3 tool/check_generated_model.py

      # 表面品質に加え、キーフレーム間の補間位置でも接地・姿勢を検証する。
      - name: モデル・表面・アニメーションを検証
        run: python3 tool/check_dashmaru.py --subframes 3

      - name: GitHub Pages 用に Web ビルド
        run: flutter build web --release --base-href /

      - name: Pages 用成果物を保存
        if: >-
          github.repository == 'FlutterKaigi/dashmaru-3d-viewer' &&
          github.event.repository.private == false &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    name: GitHub Pages に公開
    needs: check-and-build
    if: >-
      github.repository == 'FlutterKaigi/dashmaru-3d-viewer' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages の設定を確認
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
