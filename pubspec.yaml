name: dashmaru_3d_viewer
description: "FlutterKaigi のキャラクター「だしゅまる」の3Dモデルビューア。"
publish_to: none
repository: https://github.com/FlutterKaigi/dashmaru-3d-viewer
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.23.0
  vector_math: ^2.2.0
  hooks: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/flutterkaigi-logo.png
    - flutter_scene_generated/
    - LICENSE
    - assets/models/LICENSE
    - assets/models/NOTICE.md
